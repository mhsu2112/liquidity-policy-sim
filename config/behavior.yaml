# The five behavioral settings that contract section 7 lists as tuned in M1.10:
# depositor sensitivity, coordination strength, slow-depositor lag, wholesale roll
# threshold and fire-sale price impact. Nothing else is tuned.
#
# Every value below is a PLACEHOLDER, chosen in session M1.4 before any run and
# not adjusted after. They are set only in M1.10 (on the SVB-like bank under
# policy A) and then frozen in config/params_frozen.yaml.
# How each one is used: docs/amendments.md Clarification 8.

depositor_sensitivity:
  value: 1.0      # PLACEHOLDER: set only in M1.10. Share of fast depositors leaving per half-day = 1 - exp(-a x (1 - confidence))
coordination_strength:
  value: 1.0      # PLACEHOLDER: set only in M1.10. Confidence lost per unit share of uninsured deposits withdrawn over the last day
slow_depositor_lag_steps:
  value: 4        # PLACEHOLDER: set only in M1.10. Half-days before slow depositors react (4 = 2 days)
wholesale_roll_threshold:
  value: 0.6      # PLACEHOLDER: set only in M1.10. Middle of lenders' confidence cut-offs (spread +/-0.10)
fire_sale_price_impact_per_bn:
  level1:
    value: 0.0001 # PLACEHOLDER: set only in M1.10. Starting value from Clarification 5: 10 bp per $10bn (GLT 2015)
  level2a:
    value: 0.0003 # PLACEHOLDER: set only in M1.10. Starting value from Clarification 5: 30 bp per $10bn [ESTIMATE]
