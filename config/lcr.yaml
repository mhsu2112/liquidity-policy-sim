# LCR under current rules (session M1.2; repo outflows M1.7b; window-loan outflows M1.8). Option C's credit is added in engine/lcr_credit.py.
#
# Sources: docs/contract.md section 7 (HQLA haircuts) and docs/amendments.md
# Clarification 3 (outflow and inflow rates, chosen from 12 CFR 249.32 / 249.33).
# Each type's calibration (100% / 85% / 70% / none) lives in config/banks/archetypes.yaml,
# because it belongs to the bank type (contract section 1c).
# Shares are fractions (0.15 = 15%).

hqla:
  level1_haircut: 0.00     # contract 7; 12 CFR 249.21: Level 1 counts in full
  level2a_haircut: 0.15    # contract 7; 12 CFR 249.21: Level 2A counts at 85% of market value
  level2_cap: 0.40         # contract 7; 12 CFR 249.21: Level 2 at most 40% of total HQLA

outflow_rates:             # 30-day run-off rates, Clarification 3
  insured_deposits: 0.03   # 12 CFR 249.32(a)(1): stable retail deposits
  uninsured_deposits: 0.40 # 12 CFR 249.32(h)(1)(ii): non-operational corporate; same basis as contract Decision 2-2
  stwf: 1.00               # 12 CFR 249.32(h)(3): unsecured wholesale from financial counterparties, all maturing within 30 days
  repo_level1: 0.00        # 12 CFR 249.32(j)(1)(i): secured funding backed by Level 1 assets (Clarification 12 item 6)
  repo_level2a: 0.15       # 12 CFR 249.32(j)(1)(ii): secured funding backed by Level 2A assets (Clarification 12 item 6)
  # Discount window loans (Amendment 4): secured funding with a sovereign entity (12 CFR 249.3), rate by collateral.
  dw_level1: 0.00          # Amendment 4; 12 CFR 249.32(j)(1)(i): secured by Level 1
  dw_level2a: 0.15         # Amendment 4; 12 CFR 249.32(j)(1)(ii): secured by Level 2A
  dw_loans: 0.25           # Amendment 4; 12 CFR 249.32(j)(1)(iii): sovereign counterparty, non-HQLA collateral
  dw_loans_grid: [0.00, 0.25, 1.00]  # Amendment 4 sensitivity: 0% (Basel, own central bank); 100% (249.32(j)(1)(vi))

inflows:
  loan_inflow_rate: 0.00   # Clarification 3: share of loans paying in within 30 days; no inflows are modeled
  cap_share_of_outflows: 0.75  # 12 CFR 249.30: inflows count up to 75% of outflows (no effect while inflows are zero)

# Banks with no LCR requirement still get a ratio, on unadjusted outflows (Clarification 3).
no_requirement_factor: 1.00
