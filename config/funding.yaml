# The funding waterfall (session M1.3): where a bank finds cash, how much, and how fast.
#
# Sources: docs/contract.md sections 2b (window margins) and 7 (lags), and
# docs/amendments.md Clarifications 4 (collateral placement, Home Loan Bank) and
# 5 (price impact, settlement, reserve floor, bridging). Shares are fractions.
# Lags are counted in half-day steps: 0 = same half-day, 2 = next day.

time:
  steps_per_day: 2         # contract 7: two half-days per day
  days: 30                 # contract 7: 30-day episode

reserves:
  floor_share_of_assets: 0.01   # Clarification 5: operating floor, 1% of total assets [ESTIMATE]

securities:
  # Fire-sale price impact (Clarification 5) is one of the five settings tuned in
  # M1.10, so it lives in config/params_frozen.yaml and is read from there.
  settlement_lag_steps:
    level1: 2               # Clarification 5: Treasuries settle T+1
    level2a: 4              # Clarification 5: agency MBS pools T+2 [ESTIMATE]

collateral_placement:       # Clarification 4, rule 1: eligible loans under policy A
  fed_prepositioned: 0.30
  fhlb_pledged: 0.40
  unpledged: 0.30

repo:                       # Clarification 6: same-day private repo of liquid securities
  haircuts:
    level1: 0.02            # Clarification 6, item 1: Level 1 haircut 2% [ESTIMATE]
    level2a: 0.05           # Clarification 6, item 1: agency MBS haircut 5% [ESTIMATE]
  lag_steps: 0              # Clarification 6, items 1-2: cash the same half-day
  same_day_line_share_of_assets:   # Clarification 7, item 1 [ESTIMATE]; swept 50/100/150% later
    svb_like: 0.03                 # Category IV: 3% of total assets
    diversified_regional: 0.03     # Category IV: 3%
    regional_cat3: 0.10            # Category III: 10%
    gsib: 0.20                     # GSIB / large bank: 20%
  beyond_line_lag_steps: 2  # Clarification 7, item 2: further repo the next day
  # Rolling: overnight, decided each morning by the wholesale confidence rule
  # (Clarification 6 item 3, Clarification 8; agents/lenders.py).

fhlb:                       # Clarification 4, rule 2; contract 7
  line_share_of_assets: 0.05    # pre-arranged line, available the same day
  advance_rate: 0.75            # total advances at most 75% of loans pledged (line included; Clarification 5)
  above_line_lag_steps: 2       # contract 7: next day above the line

discount_window:
  margins:                  # contract 2b (Decision 2-1)
    level1: 0.96            # Treasuries >5 years; used for all Level 1 (Clarification 5)
    level2a: 0.96           # agency MBS
    resi: 0.80              # residential mortgages
    cre: 0.72               # CRE loans
    ci: 0.80                # C&I loans
  lag_steps:                # contract 7
    prepositioned_tested: 0     # same half-day if tested in the last 90 days
    prepositioned_untested: 2   # 1 day
    securities: 2               # 1 day for securities not prepositioned
    unprepositioned_loans: 20   # "not available within 10 days"; usable from day 11 (Clarification 5)
