# Fixed behavioral structure for depositors and wholesale lenders (session M1.4).
# Source: docs/amendments.md Clarification 8. These are NOT tuned; the five
# tuned settings live in config/behavior.yaml. Shares are fractions.

depositors:
  fast_share_of_uninsured:          # Clarification 8, item 1 [ESTIMATE], anchored to contract 1a
    svb_like: 0.90                  # SVB: ~86% of uninsured deposits left or queued within two days
    diversified_regional: 0.40      # First Republic pace: ~1/3 of uninsured on the worst day
    regional_cat3: 0.40             # as diversified regional
    gsib: 0.15                      # largely operational corporate deposits (Cipriani, Eisenbach & Kovner 2024)
  insured_rate_vs_fast: 0.05        # Clarification 8, item 2: insured leave at 5% of the fast rate [ESTIMATE]

confidence:
  shock_half_life_steps: 4          # Clarification 8, item 2: news fades with a 2-day half-life [ESTIMATE]
  coordination_window_steps: 2      # Clarification 8, item 2: withdrawals over the last day feed back
  news_noise_sd: 0.10               # Clarification 8, item 2: the shock lands +/-10% harder or softer [ESTIMATE]

lenders:
  cutoff_spread: 0.10               # Clarification 8, item 3: lenders' cut-offs spread evenly +/-0.10 around the threshold [ESTIMATE]
  stwf_maturing_share_per_day: 0.0333333333333  # Clarification 8, item 3: 1/30 of starting balance a day [ESTIMATE]
  decide_at_step_of_day: 0          # Clarification 8, item 3: lenders decide each morning
